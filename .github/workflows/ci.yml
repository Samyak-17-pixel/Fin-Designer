name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Test
        run: |
          export PYTEST_DISABLE_PLUGIN_AUTOLOAD=1
          pytest -q
      - name: Golden smoke
        run: |
          auv-fin --golden --max-span-over-d 0.55 || true
