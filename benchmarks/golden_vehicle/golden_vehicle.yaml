# Golden vehicle benchmark — student/research torpedo AUV
name: golden_vehicle_v1
description: Aft X-tail reference case for release regression

vehicle:
  length_m: 1.35
  diameter_m: 0.1685
  mass_kg: 24.0
  water: freshwater
  cg_fraction_of_length: 0.5
  fin_root_le_fraction_of_length: 0.92  # aft

mission:
  design_speed_mps: 1.5
  max_speed_mps: 2.0
  turning_radius_m: 6.0
  turn_establishment_s: 30.0

fins:
  count: 4
  configuration: X
  clocking_deg: [45.0, 135.0, 225.0, 315.0]

servo:
  rated_torque_nm: 3.481  # 35.5 kg·cm stall torque
  shaft_diameter_m: 0.006
  max_rotation_deg: 180.0

material: PLA
